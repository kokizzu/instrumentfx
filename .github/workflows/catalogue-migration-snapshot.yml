name: Catalogue migration source snapshot

on:
  push:
    branches: [main]
    paths: ['.github/workflows/catalogue-migration-snapshot.yml']

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Export exact public source revision without external actions
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, io, json, tarfile, urllib.request
          revision = '47262c0c630f49e72fef855a4ecc67cefaba6d40'
          url = 'https://api.github.com/repos/kokizzu/instrumentfx/tarball/' + revision
          req = urllib.request.Request(url, headers={'User-Agent':'instrumentfx-catalogue-migration'})
          payload = urllib.request.urlopen(req, timeout=60).read()
          files = {}
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as archive:
              for entry in archive.getmembers():
                  if not entry.isfile() or '/' not in entry.name:
                      continue
                  path = entry.name.split('/', 1)[1]
                  if path not in ('README.md','AGENTS.md') and not path.startswith('effects/'):
                      continue
                  if not path.endswith(('.md','.json')):
                      continue
                  data = archive.extractfile(entry).read()
                  files[path] = {'content': data.decode('utf-8'), 'bytes': len(data),
                      'sha256': hashlib.sha256(data).hexdigest(),
                      'git_blob_sha': hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()}
          packed = json.dumps({'revision':revision,'files':files}, ensure_ascii=False, sort_keys=True).encode()
          encoded = base64.b64encode(gzip.compress(packed, mtime=0)).decode()
          print('SNAPSHOT_FILES',len(files),'JSON_BYTES',len(packed),'SHA256',hashlib.sha256(packed).hexdigest())
          for offset in range(0,len(encoded),4096):
              print('SNAPSHOT_CHUNK',offset//4096,encoded[offset:offset+4096])
          print('SNAPSHOT_COMPLETE')
          PY
